<!doctype html>
<html lang="pt-BR">
<head>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b0f14"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Pontinho"><link rel="apple-touch-icon" href="icon-192.png">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pontinho</title><link rel="stylesheet" href="style.css">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pontinho">

<style>
.app-brand-icon{
  width:58px;
  height:58px;
  object-fit:cover;
  border-radius:14px;
  vertical-align:-17px;
  margin-right:10px;
  box-shadow:0 4px 12px rgba(0,0,0,.30);
}
</style>

</head>
<body>
<div class="app">
<header><div><span class="eyebrow">CONTROLE DE PONTUAÇÃO</span><h1><img class="app-brand-icon" src="icon-192.png" alt="" aria-hidden="true"> Pontinho</h1></div><button id="menuBtn" class="menu-btn" type="button" aria-label="Abrir menu" aria-expanded="false">⋮</button><div id="menu" class="menu hidden" role="menu">
  <button id="menuNew" type="button">＋ Nova partida</button>
  <button id="menuHistory" type="button">☷ Histórico</button>
  <button id="menuSettings" type="button">⚙ Configurações</button>
  <button id="menuEnd" class="menu-danger hidden" type="button">⏻ Encerrar partida</button>
</div></header>
<section class="card">
  <div class="card-head"><b>Última partida</b></div>
  <div id="lastGame" class="empty">Nenhuma partida em andamento.</div>
  <div class="home-actions">
    <button id="newGameBtn" class="primary large">Nova partida</button>
    <button id="continueBtn" class="continue-btn large hidden">Continuar partida</button>
  </div>
</section>
<section id="panel" class="card hidden"></section>
<footer>Pontinho • v2.2</footer>
</div><script src="app.js"></script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"));}</script>

</body></html>
